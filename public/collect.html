<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Census of Hands — Collect</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: max(16px, env(safe-area-inset-top)) 16px 16px;
        gap: 14px;
      }
      #progress {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .cell {
        width: 52px;
        text-align: center;
        font-size: 13px;
      }
      .cell b {
        display: block;
        font-size: 16px;
      }
      .cell .meter {
        height: 4px;
        border-radius: 2px;
        background: var(--line);
        overflow: hidden;
        margin-top: 3px;
      }
      .cell .meter i {
        display: block;
        height: 100%;
        background: var(--ok);
      }
      .cell.now b {
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      #prompt {
        text-align: center;
        line-height: 1.1;
      }
      #glyph {
        font-size: 64px;
        font-weight: 600;
      }
      #hint {
        font-size: 15px;
      }
      /* The border lives on the wrapper so the canvas's own box is exactly its drawing area. */
      #box-wrap {
        position: relative;
        width: min(78vw, 56vh);
        aspect-ratio: 1;
        background: var(--paper);
        border: 2px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        transition: border-color 0.25s;
      }
      #box-wrap.saved {
        border-color: var(--ok);
      }
      #box {
        width: 100%;
        height: 100%;
      }
      #timer {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 10px;
        height: 3px;
        border-radius: 2px;
        background: var(--ok);
        transform: scaleX(0);
        transform-origin: left;
      }
      #actions {
        display: flex;
        gap: 10px;
      }
      #toast {
        min-height: 20px;
        font-size: 14px;
      }
    </style>
  </head>
  <body class="surface">
    <div id="progress"></div>
    <div id="prompt">
      <div id="glyph">&nbsp;</div>
      <div id="hint" class="muted">&nbsp;</div>
    </div>
    <div id="box-wrap">
      <canvas id="box"></canvas>
      <div id="timer"></div>
    </div>
    <div id="actions">
      <button id="redo" type="button">Redo</button>
      <button id="skip" type="button">Skip</button>
      <button id="undo" type="button">Delete last saved</button>
    </div>
    <div id="toast" class="muted"></div>
    <script type="module" src="collect.js"></script>
  </body>
</html>
